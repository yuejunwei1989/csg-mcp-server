[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coverity-semantic-graph"
version = "0.1.0"
description = "Compiler-grade C/C++ code knowledge graph MCP server backed by Coverity"
requires-python = ">=3.10"
dependencies = ["mcp>=1.0,<2"]

[project.scripts]
csg-index = "csg.cli:main"
csg-mcp = "csg.mcp_server:main"
csg-ls = "csg.lsp_server:main"
csg-agent-setup = "csg.agent_setup:main"

[tool.setuptools.packages.find]
where = ["src"]
